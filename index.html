<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일의 체크리스트</title>
    <!-- Tailwind CSS 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 설정 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1F2937', 
                        secondary: '#6B7280', 
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 체크박스 스타일링 */
        input[type="checkbox"] {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #D1D5DB;
            border-radius: 0.35em;
            transform: translateY(-0.075em);
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 0.9em;
            height: 0.9em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked {
            background-color: #1F2937;
            border-color: #1F2937;
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        /* 텍스트 취소선 애니메이션 */
        .task-text {
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 2px;
            background-color: #9CA3AF;
            transition: width 0.3s ease;
        }

        .task-item.completed .task-text {
            color: #9CA3AF;
        }

        .task-item.completed .task-text::after {
            width: 100%;
        }

        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        .safe-area-pb {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        /* PC에서도 스마트폰 비율(세로가 긴 직사각형)로 보이도록 고정 */
        @media (min-width: 640px) {
            .mobile-frame-container {
                width: 100%;
                max-width: 410px;
                height: 852px; /* 아이폰 Pro Max 기준 비율 */
                max-height: 90vh;
                border-radius: 2.5rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
                border: 8px solid #1f2937; /* 스마트폰 외곽 테두리 느낌 */
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-[100dvh] overflow-hidden flex flex-col sm:items-center sm:justify-center">

    <!-- 모바일 전체 화면, PC 감성 스마트폰 프레임 UI -->
    <div class="mobile-frame-container bg-white w-full flex flex-col h-full relative">
        
        <!-- 헤더 영역: 날짜, 제목 및 퍼센트, 통계보기 버튼 (상단 잘림 방지 pt-6 적용) -->
        <header class="shrink-0 bg-white pt-6 px-5 sm:px-6 pb-4 border-b border-gray-100 relative">
            <div class="flex justify-between items-center mb-1">
                <div id="current-date" class="text-sm text-gray-500 font-medium tracking-tight"></div>
                <button id="btn-open-stats" class="text-xs bg-gray-100 text-gray-700 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-chart-simple"></i> 날짜별 통계
                </button>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-3">오늘 해야 할 일</h1>
            
            <div class="flex justify-between items-end mt-1 mb-3">
                <div>
                    <span id="completed-count" class="text-3xl font-bold text-gray-900">0</span>
                    <span class="text-gray-300 mx-1">/</span>
                    <span id="total-count" class="text-xl text-gray-400">0</span>
                    <span class="ml-1 text-sm text-gray-500">완료</span>
                </div>
                <div class="text-right">
                    <div id="progress-percent" class="text-4xl font-bold text-gray-900">0%</div>
                </div>
            </div>

            <!-- 프로그레스 바 -->
            <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-gray-800 transition-all duration-500 ease-out" style="width: 0%;"></div>
            </div>
        </header>

        <!-- 새 할 일 추가 입력창을 헤더와 목록 사이로 배치 -->
        <div class="shrink-0 bg-gray-50 p-3 border-b border-gray-100">
            <form id="add-task-form" class="flex gap-2">
                <select id="new-task-priority" class="shrink-0 bg-white border border-gray-200 text-gray-700 rounded-lg px-2 sm:px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-gray-800">
                    <option value="1">1순위</option>
                    <option value="2">2순위</option>
                    <option value="3">3순위</option>
                </select>
                <input type="text" id="new-task-input" placeholder="새로운 할 일..." class="flex-1 min-w-0 bg-white border border-gray-200 text-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-gray-800" required>
                <button type="submit" class="shrink-0 bg-gray-800 text-white w-10 h-10 rounded-lg hover:bg-gray-700 transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>

        <!-- 메인 목록 영역 -->
        <main class="flex-1 overflow-y-auto p-4 bg-gray-50/50" id="task-list-container">
            <!-- 자바스크립트로 동적 렌더링 -->
        </main>

        <!-- 하단 영역 -->
        <footer class="shrink-0 p-2 border-t border-gray-100 bg-white safe-area-pb text-center text-xs text-gray-400">
            매일 자정에 체크리스트가 초기화됩니다.
        </footer>
    </div>

    <!-- 내용 및 순위 수정 모달 -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-xl w-11/12 max-w-sm border border-gray-100">
            <h3 class="text-lg font-bold mb-4 text-gray-900">할 일 수정</h3>
            <input type="hidden" id="edit-task-id">
            
            <label class="block text-sm font-medium text-gray-700 mb-1">할 일 내용</label>
            <input type="text" id="edit-task-text" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-1 focus:ring-gray-800" required>
            
            <label class="block text-sm font-medium text-gray-700 mb-1">우선순위</label>
            <select id="edit-task-priority" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 mb-6 focus:outline-none focus:ring-1 focus:ring-gray-800">
                <option value="1">★★★★★ 1순위</option>
                <option value="2">★★★★ 2순위</option>
                <option value="3">★★★ 3순위</option>
            </select>
            <div class="flex justify-end gap-2">
                <button id="btn-cancel-edit" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">취소</button>
                <button id="btn-save-edit" class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors">저장</button>
            </div>
        </div>
    </div>

    <!-- 날짜별 통계 및 그래프 모달 -->
    <div id="stats-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-xl w-11/12 max-w-md border border-gray-100 flex flex-col max-h-[80dvh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-chart-simple text-gray-700 mr-2"></i>최근 날짜별 달성률</h3>
                <button id="btn-close-stats" class="text-gray-400 hover:text-gray-700 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="text-xs text-gray-500 mb-3">최근 기록된 날짜별 달성 퍼센트 그래프입니다.</div>
            
            <!-- 그래프 리스트 영역 -->
            <div id="stats-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- 동적 생성 -->
            </div>

            <div class="mt-5 pt-3 border-t border-gray-100 flex justify-end">
                <button id="btn-close-stats-bottom" class="px-4 py-2 bg-gray-800 text-white text-sm rounded-lg hover:bg-gray-700 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <script>
        const defaultTasks = [
            { id: 't1', text: '영양제', priority: 1, completed: false, pinned: false },
            { id: 't2', text: '물 2L', priority: 1, completed: true, pinned: false },
            { id: 't3', text: '운동 30분', priority: 1, completed: false, pinned: false },
            { id: 't4', text: '가계부', priority: 1, completed: true, pinned: false },
            { id: 't5', text: '독서', priority: 2, completed: true, pinned: false },
            { id: 't6', text: '영어', priority: 2, completed: true, pinned: false },
            { id: 't7', text: '블로그', priority: 2, completed: false, pinned: false },
            { id: 't8', text: '방 청소', priority: 3, completed: false, pinned: false },
            { id: 't9', text: '빨래', priority: 3, completed: false, pinned: false },
            { id: 't10', text: '스트레칭', priority: 3, completed: true, pinned: false },
        ];

        let tasks = [];
        let historyData = {}; 
        let lastResetDate = '';

        // DOM 요소
        const container = document.getElementById('task-list-container');
        const completedCountEl = document.getElementById('completed-count');
        const totalCountEl = document.getElementById('total-count');
        const progressPercentEl = document.getElementById('progress-percent');
        const progressBarEl = document.getElementById('progress-bar');
        const addForm = document.getElementById('add-task-form');
        const newTaskInput = document.getElementById('new-task-input');
        const newTaskPriority = document.getElementById('new-task-priority');
        
        // 모달 요소들
        const editModal = document.getElementById('edit-modal');
        const editTaskId = document.getElementById('edit-task-id');
        const editTaskText = document.getElementById('edit-task-text');
        const editTaskPriority = document.getElementById('edit-task-priority');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');
        const btnSaveEdit = document.getElementById('btn-save-edit');

        const statsModal = document.getElementById('stats-modal');
        const statsContainer = document.getElementById('stats-container');
        const btnOpenStats = document.getElementById('btn-open-stats');
        const btnCloseStats = document.getElementById('btn-close-stats');
        const btnCloseStatsBottom = document.getElementById('btn-close-stats-bottom');

        function init() {
            loadData();
            checkDailyReset();
            updateDateDisplay();
            renderTasks();
            updateProgress();
            setupEventListeners();
        }

        function updateDateDisplay() {
            const dateEl = document.getElementById('current-date');
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateEl.textContent = now.toLocaleDateString('ko-KR', options);
        }

        function loadData() {
            const savedTasks = localStorage.getItem('checklist_tasks');
            const savedDate = localStorage.getItem('checklist_last_reset');
            const savedHistory = localStorage.getItem('checklist_history');
            
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
                // 기존 데이터에 pinned 속성이 없을 경우 기본값 부여
                tasks.forEach(t => { if (t.pinned === undefined) t.pinned = false; });
            } else {
                tasks = [...defaultTasks];
                saveData();
            }

            if (savedHistory) {
                historyData = JSON.parse(savedHistory);
            }

            const today = getTodayDateString();
            if (savedDate) {
                lastResetDate = savedDate;
            } else {
                lastResetDate = today;
                localStorage.setItem('checklist_last_reset', lastResetDate);
            }
        }

        function saveData() {
            localStorage.setItem('checklist_tasks', JSON.stringify(tasks));
            localStorage.setItem('checklist_history', JSON.stringify(historyData));
        }

        function getTodayDateString() {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            return (new Date(today - offset)).toISOString().split('T')[0];
        }

        function recordTodayProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            const today = getTodayDateString();
            historyData[today] = percent;
            localStorage.setItem('checklist_history', JSON.stringify(historyData));
        }

        function checkDailyReset() {
            const today = getTodayDateString();
            
            if (lastResetDate !== today) {
                recordTodayProgress();

                tasks.forEach(task => {
                    task.completed = false; 
                });
                
                lastResetDate = today;
                localStorage.setItem('checklist_last_reset', lastResetDate);
                saveData();
            }
        }

        function getPriorityStars(priority) {
            switch(parseInt(priority)) {
                case 1: return '<span class="text-gray-800 text-sm tracking-widest">★★★★★</span> <span class="font-bold text-gray-900 ml-2">1순위</span>';
                case 2: return '<span class="text-gray-800 text-sm tracking-widest">★★★★<span class="text-gray-300">★</span></span> <span class="font-bold text-gray-900 ml-2">2순위</span>';
                case 3: return '<span class="text-gray-800 text-sm tracking-widest">★★★<span class="text-gray-300">★★</span></span> <span class="font-bold text-gray-900 ml-2">3순위</span>';
                default: return '';
            }
        }

        function renderTasks() {
            container.innerHTML = '';

            for (let i = 1; i <= 3; i++) {
                // 고정된(Pinned) 항목이 위로 오도록 정렬
                const groupTasks = tasks
                    .filter(task => parseInt(task.priority) === i)
                    .sort((a, b) => (b.pinned === true) - (a.pinned === true));
                
                if (groupTasks.length > 0) {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'mb-6 last:mb-2';
                    
                    const groupHeader = document.createElement('h2');
                    groupHeader.className = 'text-lg mb-3 flex items-center';
                    groupHeader.innerHTML = getPriorityStars(i);
                    groupDiv.appendChild(groupHeader);

                    const taskList = document.createElement('ul');
                    taskList.className = 'space-y-2';

                    groupTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = `task-item bg-white border ${task.pinned ? 'border-gray-400 shadow-sm bg-gray-50/50' : 'border-gray-100'} p-3 rounded-xl shadow-sm flex justify-between items-center transition-all hover:shadow-md ${task.completed ? 'completed bg-gray-50/80 opacity-70' : ''}`;
                        
                        li.innerHTML = `
                            <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                                <span class="task-text text-gray-800 text-[15px] font-medium truncate">${task.text}</span>
                            </label>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="togglePin('${task.id}')" class="p-2 transition-colors ${task.pinned ? 'text-gray-900 font-bold' : 'text-gray-300 hover:text-gray-600'}">
                                    <i class="fa-solid fa-thumbtack" title="${task.pinned ? '고정 해제' : '상단 고정'}"></i>
                                </button>
                                <button onclick="openEditModal('${task.id}', '${task.text.replace(/'/g, "\\'")}', ${task.priority})" class="text-gray-400 hover:text-gray-800 p-2 transition-colors">
                                    <i class="fa-solid fa-pen" title="수정"></i>
                                </button>
                                <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 p-2 transition-colors">
                                    <i class="fa-regular fa-trash-can" title="삭제"></i>
                                </button>
                            </div>
                        `;
                        taskList.appendChild(li);
                    });

                    groupDiv.appendChild(taskList);
                    container.appendChild(groupDiv);
                }
            }
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60 py-10">
                        <i class="fa-solid fa-list-check text-5xl mb-4"></i>
                        <p>새로운 할 일을 추가해보세요!</p>
                    </div>
                `;
            }
        }

        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderTasks();
                updateProgress();
            }
        };

        window.togglePin = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.pinned = !task.pinned;
                saveData();
                renderTasks();
            }
        };

        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            
            let percent = 0;
            if (total > 0) {
                percent = Math.round((completed / total) * 100);
            }

            totalCountEl.textContent = total;
            completedCountEl.textContent = completed;
            progressPercentEl.textContent = `${percent}%`;
            progressBarEl.style.width = `${percent}%`;

            recordTodayProgress();

            if (percent === 100 && total > 0) {
                progressPercentEl.classList.remove('text-gray-900');
                progressPercentEl.classList.add('text-green-600');
                progressBarEl.classList.remove('bg-gray-800');
                progressBarEl.classList.add('bg-green-500');
            } else {
                progressPercentEl.classList.remove('text-green-600');
                progressPercentEl.classList.add('text-gray-900');
                progressBarEl.classList.remove('bg-green-500');
                progressBarEl.classList.add('bg-gray-800');
            }
        }

        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
            updateProgress();
        };

        function renderStatsModal() {
            statsContainer.innerHTML = '';
            const sortedDates = Object.keys(historyData).sort().reverse();
            
            if (sortedDates.length === 0) {
                statsContainer.innerHTML = '<div class="text-center text-gray-400 py-8">저장된 통계 기록이 없습니다.</div>';
                return;
            }

            sortedDates.forEach(dateStr => {
                const percent = historyData[dateStr];
                
                const row = document.createElement('div');
                row.className = 'bg-gray-50 p-3 rounded-xl border border-gray-100';
                
                row.innerHTML = `
                    <div class="flex justify-between items-center mb-1.5 text-sm">
                        <span class="font-medium text-gray-700">${dateStr}</span>
                        <span class="font-bold text-gray-900">${percent}%</span>
                    </div>
                    <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gray-800 rounded-full transition-all duration-300" style="width: ${percent}%;"></div>
                    </div>
                `;
                statsContainer.appendChild(row);
            });
        }

        function setupEventListeners() {
            addForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const text = newTaskInput.value.trim();
                const priority = parseInt(newTaskPriority.value);
                
                if (text) {
                    const newTask = {
                        id: 't_' + Date.now(),
                        text: text,
                        priority: priority,
                        completed: false,
                        pinned: false
                    };
                    
                    tasks.push(newTask);
                    saveData();
                    renderTasks();
                    updateProgress();
                    
                    newTaskInput.value = '';
                }
            });

            btnCancelEdit.addEventListener('click', () => editModal.classList.add('hidden'));
            editModal.addEventListener('click', (e) => { if (e.target === editModal) editModal.classList.add('hidden'); });

            btnSaveEdit.addEventListener('click', function() {
                const id = editTaskId.value;
                const newText = editTaskText.value.trim();
                const newPriority = parseInt(editTaskPriority.value);
                
                if (!newText) {
                    editTaskText.focus();
                    return;
                }
                
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.text = newText;
                    task.priority = newPriority;
                    saveData();
                    renderTasks();
                }
                editModal.classList.add('hidden');
            });

            btnOpenStats.addEventListener('click', () => {
                renderStatsModal();
                statsModal.classList.remove('hidden');
                statsModal.classList.add('flex');
            });

            const closeStats = () => {
                statsModal.classList.add('hidden');
                statsModal.classList.remove('flex');
            };

            btnCloseStats.addEventListener('click', closeStats);
            btnCloseStatsBottom.addEventListener('click', closeStats);
            statsModal.addEventListener('click', (e) => { if (e.target === statsModal) closeStats(); });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    checkDailyReset();
                    renderTasks();
                    updateProgress();
                }
            });
        }

        window.openEditModal = function(id, text, currentPriority) {
            editTaskId.value = id;
            editTaskText.value = text;
            editTaskPriority.value = currentPriority;
            
            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            setTimeout(() => editTaskText.focus(), 100);
        };

        init();
    </script>
</body>
</html>
