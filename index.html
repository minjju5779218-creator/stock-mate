<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일의 체크리스트</title>
    <!-- Tailwind CSS 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 설정 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1F2937', // Gray-800 (심플한 다크 그레이)
                        secondary: '#6B7280', // Gray-500 (서브 텍스트용)
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 체크박스 스타일링 */
        input[type="checkbox"] {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #D1D5DB;
            border-radius: 0.35em;
            transform: translateY(-0.075em);
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 0.9em;
            height: 0.9em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked {
            background-color: #1F2937;
            border-color: #1F2937;
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        /* 텍스트 취소선 애니메이션 */
        .task-text {
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 2px;
            background-color: #9CA3AF;
            transition: width 0.3s ease;
        }

        .task-item.completed .task-text {
            color: #9CA3AF;
        }

        .task-item.completed .task-text::after {
            width: 100%;
        }

        /* 드래그 앤 드롭 표시 스타일 (순위 변경용 - 여기서는 셀렉트 박스로 대체하여 사용성을 높임) */
        
        /* 스크롤바 숨기기 (모바일 뷰 최적화) */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        /* iOS 하단 안전 영역(Safe Area) 대응 - 홈 인디케이터에 가려지지 않도록 */
        .safe-area-pb {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-[100dvh] overflow-hidden flex flex-col sm:items-center sm:justify-center">

    <!-- 모바일에서는 전체 화면 꽉 차게, PC/태블릿에서는 둥근 카드 형태로 고정 -->
    <div class="bg-white w-full sm:max-w-md flex flex-col h-full sm:h-auto sm:max-h-[90dvh] sm:rounded-2xl sm:shadow-sm sm:border border-gray-200 relative">
        
        <!-- 헤더 영역: 날짜, 제목 및 진행률 (shrink-0으로 줄어들지 않게 고정) -->
        <header class="shrink-0 bg-white p-5 sm:p-6 pb-4 border-b border-gray-100 relative">
            <div id="current-date" class="text-sm text-gray-500 font-medium mb-1 tracking-tight"></div>
            <h1 class="text-2xl font-bold text-gray-900 mb-4">오늘 해야 할 일</h1>
            
            <div class="flex justify-between items-end mt-2 mb-4">
                <div>
                    <span id="completed-count" class="text-3xl font-bold text-gray-900">0</span>
                    <span class="text-gray-300 mx-1">/</span>
                    <span id="total-count" class="text-xl text-gray-400">0</span>
                    <span class="ml-1 text-sm text-gray-500">완료</span>
                </div>
                <div class="text-right">
                    <div id="progress-percent" class="text-4xl font-bold text-gray-900">0%</div>
                </div>
            </div>

            <!-- 프로그레스 바 (심플 모노톤) -->
            <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-gray-800 transition-all duration-500 ease-out" style="width: 0%;"></div>
            </div>
        </header>

        <!-- 메인 목록 영역 -->
        <main class="flex-1 overflow-y-auto p-4 bg-gray-50/50" id="task-list-container">
            <!-- 자바스크립트로 동적 렌더링 될 영역 -->
        </main>

        <!-- 푸터 영역: 새 할 일 추가 (shrink-0 적용 및 안전영역 패딩 추가) -->
        <footer class="shrink-0 p-3 sm:p-4 border-t border-gray-100 bg-white safe-area-pb">
            <form id="add-task-form" class="flex gap-2">
                <select id="new-task-priority" class="shrink-0 bg-gray-50 border border-gray-200 text-gray-700 rounded-lg px-2 sm:px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800">
                    <option value="1">1순위</option>
                    <option value="2">2순위</option>
                    <option value="3">3순위</option>
                </select>
                <!-- 좁은 화면에서도 찌그러지지 않도록 min-w-0 적용 -->
                <input type="text" id="new-task-input" placeholder="새로운 할 일..." class="flex-1 min-w-0 bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800" required>
                <!-- 버튼을 정사각형으로 고정 -->
                <button type="submit" class="shrink-0 bg-gray-800 text-white w-10 h-10 sm:w-11 sm:h-11 rounded-lg hover:bg-gray-700 transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </footer>
    </div>

    <!-- 내용 및 순위 수정 모달 (숨김 처리) -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-xl w-11/12 max-w-sm border border-gray-100">
            <h3 class="text-lg font-bold mb-4 text-gray-900">할 일 수정</h3>
            <input type="hidden" id="edit-task-id">
            
            <label class="block text-sm font-medium text-gray-700 mb-1">할 일 내용</label>
            <input type="text" id="edit-task-text" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-1 focus:ring-gray-800" required>
            
            <label class="block text-sm font-medium text-gray-700 mb-1">우선순위</label>
            <select id="edit-task-priority" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 mb-6 focus:outline-none focus:ring-1 focus:ring-gray-800">
                <option value="1">★★★★★ 1순위</option>
                <option value="2">★★★★ 2순위</option>
                <option value="3">★★★ 3순위</option>
            </select>
            <div class="flex justify-end gap-2">
                <button id="btn-cancel-edit" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">취소</button>
                <button id="btn-save-edit" class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors">저장</button>
            </div>
        </div>
    </div>

    <script>
        // 초기 데이터 (로컬 스토리지에 없을 경우 사용)
        const defaultTasks = [
            { id: 't1', text: '영양제', priority: 1, completed: false },
            { id: 't2', text: '물 2L', priority: 1, completed: true },
            { id: 't3', text: '운동 30분', priority: 1, completed: false },
            { id: 't4', text: '가계부', priority: 1, completed: true },
            { id: 't5', text: '독서', priority: 2, completed: true },
            { id: 't6', text: '영어', priority: 2, completed: true },
            { id: 't7', text: '블로그', priority: 2, completed: false },
            { id: 't8', text: '방 청소', priority: 3, completed: false },
            { id: 't9', text: '빨래', priority: 3, completed: false },
            { id: 't10', text: '스트레칭', priority: 3, completed: true },
        ];

        let tasks = [];
        let lastResetDate = '';

        // DOM 요소
        const container = document.getElementById('task-list-container');
        const completedCountEl = document.getElementById('completed-count');
        const totalCountEl = document.getElementById('total-count');
        const progressPercentEl = document.getElementById('progress-percent');
        const progressBarEl = document.getElementById('progress-bar');
        const addForm = document.getElementById('add-task-form');
        const newTaskInput = document.getElementById('new-task-input');
        const newTaskPriority = document.getElementById('new-task-priority');
        
        // 모달 요소
        const editModal = document.getElementById('edit-modal');
        const editTaskId = document.getElementById('edit-task-id');
        const editTaskText = document.getElementById('edit-task-text');
        const editTaskPriority = document.getElementById('edit-task-priority');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');
        const btnSaveEdit = document.getElementById('btn-save-edit');

        // 초기화 함수
        function init() {
            loadData();
            checkDailyReset();
            updateDateDisplay();
            renderTasks();
            updateProgress();
            setupEventListeners();
        }

        // 날짜 표시 함수
        function updateDateDisplay() {
            const dateEl = document.getElementById('current-date');
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateEl.textContent = now.toLocaleDateString('ko-KR', options);
        }

        // 로컬 스토리지에서 데이터 불러오기
        function loadData() {
            const savedTasks = localStorage.getItem('checklist_tasks');
            const savedDate = localStorage.getItem('checklist_last_reset');
            
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
            } else {
                tasks = [...defaultTasks];
                saveData();
            }

            if (savedDate) {
                lastResetDate = savedDate;
            } else {
                lastResetDate = getTodayDateString();
                localStorage.setItem('checklist_last_reset', lastResetDate);
            }
        }

        // 데이터 저장하기
        function saveData() {
            localStorage.setItem('checklist_tasks', JSON.stringify(tasks));
        }

        // 오늘 날짜 문자열 가져오기 (YYYY-MM-DD)
        function getTodayDateString() {
            const today = new Date();
            // 로컬 시간대 기준으로 날짜 문자열 생성 (YYYY-MM-DD 형식)
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
            return localISOTime;
        }

        // 매일 자정 리셋 체크
        function checkDailyReset() {
            const today = getTodayDateString();
            
            // 저장된 마지막 리셋 날짜와 오늘 날짜가 다르면 초기화
            if (lastResetDate !== today) {
                tasks.forEach(task => {
                    task.completed = false; // 모든 체크 해제
                });
                
                lastResetDate = today;
                localStorage.setItem('checklist_last_reset', lastResetDate);
                saveData();
                console.log('하루가 지나 체크리스트가 초기화되었습니다.');
            }
        }

        // 우선순위에 따른 별 표시 함수 (심플 톤)
        function getPriorityStars(priority) {
            switch(parseInt(priority)) {
                case 1: return '<span class="text-gray-800 text-sm tracking-widest">★★★★★</span> <span class="font-bold text-gray-900 ml-2">1순위</span>';
                case 2: return '<span class="text-gray-800 text-sm tracking-widest">★★★★<span class="text-gray-300">★</span></span> <span class="font-bold text-gray-900 ml-2">2순위</span>';
                case 3: return '<span class="text-gray-800 text-sm tracking-widest">★★★<span class="text-gray-300">★★</span></span> <span class="font-bold text-gray-900 ml-2">3순위</span>';
                default: return '';
            }
        }

        // 할 일 목록 렌더링
        function renderTasks() {
            container.innerHTML = '';

            // 1, 2, 3 순위별로 그룹화
            for (let i = 1; i <= 3; i++) {
                const groupTasks = tasks.filter(task => parseInt(task.priority) === i);
                
                if (groupTasks.length > 0) {
                    // 그룹 헤더 생성
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'mb-6 last:mb-2';
                    
                    const groupHeader = document.createElement('h2');
                    groupHeader.className = 'text-lg mb-3 flex items-center';
                    groupHeader.innerHTML = getPriorityStars(i);
                    groupDiv.appendChild(groupHeader);

                    const taskList = document.createElement('ul');
                    taskList.className = 'space-y-2';

                    // 각 그룹 내의 할 일 아이템 생성
                    groupTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = `task-item bg-white border border-gray-100 p-3 rounded-xl shadow-sm flex justify-between items-center transition-all hover:shadow-md ${task.completed ? 'completed bg-gray-50/80 opacity-70' : ''}`;
                        
                        // 아이템 내부 HTML 구조
                        li.innerHTML = `
                            <label class="flex items-center gap-3 cursor-pointer flex-1">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                                <span class="task-text text-gray-800 text-[15px] font-medium">${task.text}</span>
                            </label>
                            <div class="flex gap-1">
                                <button onclick="openEditModal('${task.id}', '${task.text.replace(/'/g, "\\'")}', ${task.priority})" class="text-gray-400 hover:text-gray-800 p-2 transition-colors">
                                    <i class="fa-solid fa-pen" title="수정"></i>
                                </button>
                                <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 p-2 transition-colors">
                                    <i class="fa-regular fa-trash-can" title="삭제"></i>
                                </button>
                            </div>
                        `;
                        taskList.appendChild(li);
                    });

                    groupDiv.appendChild(taskList);
                    container.appendChild(groupDiv);
                }
            }
            
            // 등록된 할 일이 없을 경우
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60">
                        <i class="fa-solid fa-list-check text-5xl mb-4"></i>
                        <p>새로운 할 일을 추가해보세요!</p>
                    </div>
                `;
            }
        }

        // 할 일 체크 토글
        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderTasks(); // 클래스 변경을 위해 다시 렌더링 (또는 DOM 직접 조작 가능)
                updateProgress();
            }
        };

        // 진행률 업데이트
        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            
            let percent = 0;
            if (total > 0) {
                percent = Math.round((completed / total) * 100);
            }

            // 숫자 업데이트 애니메이션 효과 없이 즉시 반영
            totalCountEl.textContent = total;
            completedCountEl.textContent = completed;
            progressPercentEl.textContent = `${percent}%`;
            
            // 바 애니메이션 반영
            progressBarEl.style.width = `${percent}%`;

            // 100% 완료 시 색상 변경 로직 (심플한 톤에 맞춰서)
            if (percent === 100 && total > 0) {
                progressPercentEl.classList.remove('text-gray-900');
                progressPercentEl.classList.add('text-green-600');
                progressBarEl.classList.remove('bg-gray-800');
                progressBarEl.classList.add('bg-green-500');
            } else {
                progressPercentEl.classList.remove('text-green-600');
                progressPercentEl.classList.add('text-gray-900');
                progressBarEl.classList.remove('bg-green-500');
                progressBarEl.classList.add('bg-gray-800');
            }
        }

        // 할 일 삭제
        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
            updateProgress();
        };

        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 폼 제출 (새 할 일 추가)
            addForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const text = newTaskInput.value.trim();
                const priority = parseInt(newTaskPriority.value);
                
                if (text) {
                    const newTask = {
                        id: 't_' + Date.now(), // 고유 ID 생성
                        text: text,
                        priority: priority,
                        completed: false
                    };
                    
                    tasks.push(newTask);
                    saveData();
                    renderTasks();
                    updateProgress();
                    
                    newTaskInput.value = ''; // 입력창 초기화
                    
                    // 스크롤 맨 아래로 이동
                    setTimeout(() => {
                        container.scrollTop = container.scrollHeight;
                    }, 100);
                }
            });

            // 모달 닫기 이벤트
            btnCancelEdit.addEventListener('click', closeEditModal);
            
            // 모달 배경 클릭시 닫기
            editModal.addEventListener('click', function(e) {
                if (e.target === editModal) closeEditModal();
            });

            // 수정 저장 (내용 및 순위)
            btnSaveEdit.addEventListener('click', function() {
                const id = editTaskId.value;
                const newText = editTaskText.value.trim();
                const newPriority = parseInt(editTaskPriority.value);
                
                if (!newText) {
                    editTaskText.focus();
                    return; // 텍스트가 비어있으면 저장하지 않음
                }
                
                const task = tasks.find(t => t.id === id);
                if (task) {
                    let isChanged = false;
                    
                    if (task.text !== newText) {
                        task.text = newText;
                        isChanged = true;
                    }
                    if (task.priority !== newPriority) {
                        task.priority = newPriority;
                        isChanged = true;
                    }
                    
                    if (isChanged) {
                        saveData();
                        renderTasks();
                    }
                }
                
                closeEditModal();
            });

            // 페이지가 보여질 때마다 날짜 변경(리셋) 체크 (예: 백그라운드에서 돌아왔을 때)
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    checkDailyReset();
                    renderTasks();
                    updateProgress();
                }
            });
        }

        // 모달 열기 함수 (전역)
        window.openEditModal = function(id, text, currentPriority) {
            editTaskId.value = id;
            editTaskText.value = text;
            editTaskPriority.value = currentPriority;
            
            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            
            // 모달 열릴 때 텍스트 인풋에 포커스
            setTimeout(() => editTaskText.focus(), 100);
        };

        // 모달 닫기 함수
        function closeEditModal() {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
        }

        // 앱 시작
        init();
    </script>
</body>
</html>
